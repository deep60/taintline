# Copy to .github/workflows/ in a repo that commits MCP client configs (.mcp.json, .vscode/mcp.json,
# .cursor/mcp.json). Findings appear as code scanning alerts on the config file's own line, and on the
# pull request diff. Starts no server and needs no tokens or scope file.
name: tripwire-audit
on:
  pull_request:
    paths: [".mcp.json", ".vscode/mcp.json", ".cursor/mcp.json", "mcp.json"]
  push:
    branches: [main]
    paths: [".mcp.json", ".vscode/mcp.json", ".cursor/mcp.json", "mcp.json"]
permissions:
  contents: read
  security-events: write     # to upload SARIF to code scanning
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: deep60/tripwire@main     # pin to a release tag or commit SHA once one exists
        with:
          fail-on: high              # high | medium | low | never
