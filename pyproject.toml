[project]
name = "taintline"
dynamic = ["version"]
description = "Red team for AI agents and MCP tool integrations: leaks proven at a sink, not judged by an LLM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "P Deepanshu" }]
requires-python = ">=3.12"
dependencies = ["pyyaml", "anthropic", "httpx", "mcp"]
keywords = ["mcp", "prompt-injection", "red-team", "ai-security", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/deep60/taintline"
Source = "https://github.com/deep60/taintline"
Issues = "https://github.com/deep60/taintline/issues"
Changelog = "https://github.com/deep60/taintline/blob/main/CHANGELOG.md"

[project.scripts]
taintline = "taintline.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/taintline/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/taintline"]
exclude = ["**/__pycache__", "**/*.pyc"]

# the lab servers ship inside the wheel so `taintline demo` and `--lab` work without a checkout
[tool.hatch.build.targets.wheel.force-include]
"lab/servers" = "taintline/_lab/servers"
"lab/collaborator/server.py" = "taintline/_lab/collaborator/server.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/lab/servers", "/lab/collaborator", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: needs Docker or the live API (excluded by default)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# pinned explicitly so lint results do not change when ruff's defaults change
select = ["E4", "E7", "E9", "F", "I"]