[project]
name = "tripwire"
version = "0.1.0"
description = "Red team for AI agents and MCP tool integrations"
requires-python = ">=3.12"
dependencies = ["pyyaml", "anthropic", "httpx", "mcp"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# pinned explicitly so lint results do not change when ruff's defaults change
select = ["E4", "E7", "E9", "F", "I"]
